name: NativeTavern iOS unsigned IPA

on:
  push:
    branches:
      - main
      - feat/ios-unsigned-ipa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nativetavern-ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ios:
    name: Build unsigned IPA for personal signing
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout personal fork
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          # pdfrx 1.3.5 (pinned by upstream) fails to compile with Dart 3.14
          # bundled in newer Flutter 3.50. Use the upstream minimum toolchain.
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Check toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version
          bash --version | head -n 1

      - name: Restore missing standard Flutter iOS scaffolding
        run: |
          # Upstream commits only selected files under ios/; fill out missing
          # generated host assets without overwriting the custom Runner files.
          flutter create --platforms=ios --project-name native_tavern .

      - name: Generate iOS app icon from the repository icon
        run: |
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          sips -s format png -z 1024 1024 icon.png \
            --out ios/Runner/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s ios/Runner/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme

      - name: Check iOS release project
        run: CHECK_ONLY=true bash ./build_ios.sh

      - name: Build and validate unsigned IPA
        run: UNSIGNED_IPA=true bash ./build_ios.sh

      - name: Generate IPA checksum
        shell: bash
        run: |
          shasum -a 256 release/NativeTavern_v*_unsigned.ipa \
            > release/NativeTavern_unsigned.sha256
          ls -lh release/NativeTavern_v*_unsigned.ipa

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: NativeTavern_iOS_unsigned_IPA
          path: |
            release/NativeTavern_v*_unsigned.ipa
            release/NativeTavern_unsigned.sha256
          if-no-files-found: error
          retention-days: 14
